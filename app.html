<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blunder Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111417">
<link rel="icon" href="icons/icon32.png">
<link rel="apple-touch-icon" href="icons/icon180.png">
<link rel="manifest" href="site.webmanifest">
<title>Blunder Lab</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <section class="left">
    <div class="who" id="top"></div>
    <div class="stage">
      <div class="bar" id="bar" aria-label="Evaluation"><i id="barFill"></i><span id="barText"></span></div>
      <div id="board"></div>
    </div>
    <div class="who" id="bottom"></div>
    <div class="nav">
      <button data-nav="start" title="First move (↑)" aria-label="First move">⏮</button>
      <button data-nav="prev" title="Back (←)" aria-label="Back">◀</button>
      <button data-nav="next" title="Forward (→)" aria-label="Forward">▶</button>
      <button data-nav="end" title="Last move (↓)" aria-label="Last move">⏭</button>
      <button data-nav="flip" title="Flip board (F)" aria-label="Flip board">⇅</button>
    </div>
    <div class="lines" id="lines" aria-live="off"></div>
  </section>
  <section class="right">
    <header>
      <div class="brand"><span class="logo">??</span>Blunder Lab</div>
      <nav class="tabs" id="tabs">
        <button data-tab="games" aria-label="Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Games</span></button><button data-tab="review" aria-label="Review"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Review</span></button><button data-tab="puzzles" aria-label="Puzzles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg><span>Puzzles</span></button><button data-tab="trainer" aria-label="Trainer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Trainer</span></button><button data-tab="insights" aria-label="Insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Insights</span></button><button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></button>
      </nav>
    </header>
    <div id="status" hidden></div>
    <main id="panel"></main>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
